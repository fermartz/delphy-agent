[[permission]]
identifier = "allow-get-secret"
description = "Allows the webview to read API keys and other secrets from the OS keychain."
commands.allow = ["get_secret"]

[[permission]]
identifier = "allow-set-secret"
description = "Allows the webview to write API keys and other secrets to the OS keychain."
commands.allow = ["set_secret"]

[[permission]]
identifier = "allow-delete-secret"
description = "Allows the webview to delete API keys and other secrets from the OS keychain."
commands.allow = ["delete_secret"]
