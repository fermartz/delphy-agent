[package]
name = "delphy-agent"
version = "0.0.0"
description = "Delphy Agent — desktop agent hub"
authors = ["Delphy Agent contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "delphy_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.0.1"
keyring-core = "1.0.0"
tauri-plugin-store = "2.4.3"
tauri-plugin-window-state = "2"
notify = "8.2.0"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2.5.9"
# Pinned to 0.8.x so cargo unifies with tauri-plugin-sql's sqlx (0.8.6): the
# `Pool<Sqlite>` types must be the SAME compiled crate for
# `replace_session_messages` to reuse the plugin's pool. If the plugin moves to
# sqlx 0.9, bump this in lockstep.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

